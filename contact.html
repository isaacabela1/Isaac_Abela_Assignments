<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="assets/styling/bootstrap.min.css">
    <link rel="stylesheet" href="assets/styling/styling.css">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar px-3 py-1">
        
        <ul class="nav nav-underline w-100 align-items-center">
            
            <li class="nav-item">
                <a class="nav-link" href="films.html">Films</a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link" href="about.html">About</a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link" href="contact.html">Contact Us</a>
            </li>
            
            <a class="navbar-brand mx-auto logo" href="index.html">
                <img src="assets/images/logo.svg" class="logo">
            </a>
            <li class="nav-item ">
                <a class="nav-link" href="watchlist.html">Watchlist</a>
            </li>
            
        </ul>
        
    </nav>
    
    <div class="contact-wrapper">
        <h1 class="contact-title">Contact Us</h1>
        <form class="contact-form">
            
            <div class="row">
                <div class="col-md-6">
                    <label>Name</label>
                    <input type="text" class="form-control">
                </div>
                
                <div class="col-md-6">
                    <label>Surname</label>
                    <input type="text" class="form-control">
                </div>
            </div>
            
            <div class="mb-4">
                <label>Email address</label>
                <input type="email" class="form-control">
            </div>
            
            <div class="mb-4">
                <label>Message</label>
                <textarea class="form-control" rows="7"></textarea>
            </div>
            
            <button type="submit" class="submit-btn">
                Submit
            </button>
            
        </form>
    </form>
</div>

</body>
